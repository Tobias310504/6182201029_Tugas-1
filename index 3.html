<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>Cocos Creator | MiniCricketMaster</title>

    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="screen-orientation" content="portrait"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>

    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <link rel="stylesheet" type="text/css" href="./style.css"/>
    <link rel="icon" href="favicon.ico"/>
  </head>
  <body>
    <h1 class="header">dasarpengembangangames2026</h1>

    <div id="GameDiv" cc_exact_fit_screen="true" style="width: 1280px; height: 960px;">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1280" height="960" tabindex="99"></canvas>
      </div>
    </div>
    <p class="footer">
      Created with <a href="https://www.cocos.com/products" title="Cocos Creator">Cocos Creator</a>
    </p>
    <script>
      (function () {
        var url = new URL(window.location.href);
        var requested = url.searchParams.get('layout');
        var local = ['localhost', '127.0.0.1', '[::1]', ''].indexOf(url.hostname) !== -1;
        var framed = requested === 'framed' || (requested !== 'game' && !local);
        window.__cricketLayout = framed ? 'framed' : 'game';
        document.body.classList.add(window.__cricketLayout);
        if (framed) {
          var frame = document.createElement('iframe');
          url.searchParams.set('layout', 'game');
          frame.src = url.href;
          frame.id = 'HostedGame';
          frame.title = 'Mini Cricket Master';
          frame.allow = 'autoplay; fullscreen';
          document.body.insertBefore(frame, document.querySelector('.footer'));
        }
      })();
    </script>
    <!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>    


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    (window.__cricketLayout === 'game') && System.import('./index.js').catch(function(err) { console.error(err); })
</script>
  </body>
</html>
